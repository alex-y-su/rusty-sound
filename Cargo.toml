[package]
name = "rusty-sound"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chromiumoxide = "0.9"
futures = "0.3.34"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "net", "io-util", "signal"] }
